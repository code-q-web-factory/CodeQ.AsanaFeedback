-
  name: 'AsanaFeedback: Widget configuration'
  uriPattern: 'codeq-asana-feedback/config'
  defaults:
    '@package': 'CodeQ.AsanaFeedback'
    '@controller': 'Feedback'
    '@action': 'config'
    '@format': 'json'
  httpMethods: ['GET']
  appendExceedingArguments: true

-
  name: 'AsanaFeedback: Frontend widget configuration'
  uriPattern: 'codeq-asana-feedback/frontend-config'
  defaults:
    '@package': 'CodeQ.AsanaFeedback'
    '@controller': 'Feedback'
    '@action': 'frontendConfig'
    '@format': 'json'
  httpMethods: ['GET']
  appendExceedingArguments: true

-
  name: 'AsanaFeedback: Prepare direct upload'
  uriPattern: 'codeq-asana-feedback/prepare'
  defaults:
    '@package': 'CodeQ.AsanaFeedback'
    '@controller': 'Feedback'
    '@action': 'prepare'
    '@format': 'json'
  httpMethods: ['POST']
  appendExceedingArguments: true
