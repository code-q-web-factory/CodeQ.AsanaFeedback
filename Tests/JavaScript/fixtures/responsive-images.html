<!doctype html>
<html>
<head><meta charset="utf-8"><title>Responsive image capture regression</title></head>
<body style="margin:0;background:white">
<div id="fixture" style="width:320px;height:200px;position:relative;background:white">
    <video src="/missing-video.mp4" style="display:none" muted></video>
    <style>.inline-color { fill: rgb(224, 128, 32); } .zero-font { font-size: 0; }</style>
    <div class="hidden-label"><span class="zero-font" style="position:absolute;left:170px;top:5px">Hidden icon label</span></div>
    <span class="zero-font" style="position:absolute;left:170px;top:150px;font-size:12px">Visible label</span>
    <svg viewBox="0 0 20 20" style="position:absolute;left:120px;top:100px;width:20px;height:20px"><rect class="inline-color" width="20" height="20"/></svg>
    <svg id="external-icon" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;left:200px;top:100px;width:20px;height:20px;color:rgb(32,64,224)"><use xlink:href="/sprite.svg#blue"/></svg>
    <svg style="position:absolute;left:240px;top:100px;width:20px;height:20px"><use href="/missing.svg#icon"/></svg>
    <noscript><iframe src="/tracking" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <div style="position:absolute;left:10px;top:10px;width:20px;height:20px;background:rgb(224,32,32)"></div>
    <picture style="position:absolute;left:40px;top:60px">
        <source srcset="/missing.svg">
        <img id="missing" src="/missing.svg" width="30" height="20" alt="" style="display:block">
    </picture>
    <object type="image/svg+xml" data="/styled.svg" style="position:absolute;left:120px;top:60px;width:30px;height:20px">Object fallback text</object>
    <picture style="position:absolute;left:80px;top:60px">
        <source srcset="/blue.svg">
        <img src="/blue.svg" width="30" height="20" alt="" style="display:block">
    </picture>
</div>
<div data-codeq-feedback style="position:fixed;left:0;top:220px">
    <button id="run">Run capture regression</button>
    <output id="result">Pending</output>
</div>
<script src="/capture.js"></script>
<script>
const frameMode = new URLSearchParams(location.search).get('iframe') === 'true';
document.querySelector('#fixture').append(document.createTextNode(String.fromCharCode(3)));
document.querySelector('#fixture').append(document.createComment('Fusion debug -- metadata'));
if (frameMode) {
    document.querySelector('#fixture').remove();
    const frame = document.createElement('iframe');
    frame.src = '/frame';
    frame.style.cssText = 'display:block;width:320px;height:200px;border:0';
    document.body.prepend(frame);
}
document.querySelector('#run').onclick = async () => {
    const output = document.querySelector('#result');
    output.textContent = 'Running';
    try {
        const target = frameMode ? document.querySelector('iframe').contentDocument : document;
        const image = target.querySelector('#missing');
        const originalMarkup = image.parentElement.outerHTML;
        const originalObjectMarkup = target.querySelector('object').outerHTML;
        const originalIconMarkup = target.querySelector('#external-icon').outerHTML;
        const canvas = await window.captureViewport({includeIframes: frameMode});
        const ratio = canvas.width / innerWidth;
        const pixel = (x, y) => Array.from(canvas.getContext('2d').getImageData(
            Math.round(x * ratio), Math.round(y * ratio), 1, 1
        ).data).join(',');
        const region = canvas.getContext('2d').getImageData(
            Math.round(160 * ratio), 0, Math.round(100 * ratio), Math.round(55 * ratio)
        ).data;
        const hiddenFallback = Array.from(region).every(value => value === 255);
        const visibleRegion = canvas.getContext('2d').getImageData(
            Math.round(160 * ratio), Math.round(145 * ratio), Math.round(120 * ratio), Math.round(30 * ratio)
        ).data;
        let visibleText = false;
        for (let index = 0; index < visibleRegion.length; index += 4) {
            if (visibleRegion[index] < 80 && visibleRegion[index + 3] === 255) visibleText = true;
        }
        const checks = [
            pixel(20, 20) === '224,32,32,255',
            pixel(50, 70) === '221,221,221,255',
            pixel(90, 70) === '32,64,224,255',
            image.parentElement.outerHTML === originalMarkup,
            hiddenFallback,
            pixel(130, 70) === '32,64,224,255',
            target.querySelector('object').outerHTML === originalObjectMarkup,
            pixel(130, 110) === '224,128,32,255',
            pixel(210, 110) === '32,64,224,255',
            target.querySelector('#external-icon').outerHTML === originalIconMarkup,
            visibleText,
        ];
        output.textContent = checks.every(Boolean) ? 'PASS' : 'FAIL: ' + JSON.stringify(checks);
    } catch (error) {
        output.textContent = 'FAIL: ' + (error.message || error.type);
    }
};
</script>
</body>
</html>
